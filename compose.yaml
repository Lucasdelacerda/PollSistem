services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-polls}
      MYSQL_USER: ${MYSQL_USER:-polls}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local-polls-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-polls}?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-polls}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-local-polls-password}
    ports:
      - "8080:8080"

  mysql-test:
    image: mysql:8.4
    profiles:
      - test
    environment:
      MYSQL_DATABASE: polls_test
      MYSQL_USER: polls_test
      MYSQL_PASSWORD: polls_test
      MYSQL_ROOT_PASSWORD: polls_test_root
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  mysql-data:
